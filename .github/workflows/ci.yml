name: Software checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src tests
      - run: rs-lab capture --source demo --frames 3 --output artifacts/demo
      - run: rs-lab analyze --source replay --input artifacts/demo --output artifacts/analysis.json
      - run: rs-lab export --source replay --input artifacts/demo --output artifacts/cloud.ply
      - run: rs-lab scene --source demo --frames 3 --output artifacts/scene --export-cloud
      - run: rs-lab scene --source replay --input artifacts/scene --frames 3 --baseline artifacts/scene/scene_000000.json --output artifacts/scene-compare
      - uses: actions/upload-artifact@v4
        with:
          name: demo-python-${{ matrix.python }}
          path: artifacts/
